<!DOCTYPE html>
<html lang="en">
<head>
<title>Roast Toast Coast Cafe</title>

<style>

@font-face {
    font-family: 'Bogart';
    src: url('https://fonts.cdnfonts.com/s/24702/Bogart-Light.woff') format('woff');
}


body {
    background-color: black;
    font-family: 'Bogart', sans-serif;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
}


.content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}


.image-container {

    background-image: url('https://images.unsplash.com/photo-1514066558159-fc8c737ef259?q=80&w=2574&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8MHx8fA%3D%3D');

    background-size: cover;
    background-position: center;
    height: 100%;

}


.header-container {

    background: wheat;
    border-radius: 15px;
    padding: 20px;
    width: 90%;
    text-align: center;

}


h1 {
    color: #FFCC00;
    font-size: 3em;
}


p {
    color: white;
}


.menu-section {

    background-color: black;
    color: white;
    padding: 10px;
    width: 60%;
    border-radius: 10px;
    text-align: center;

}


.menu-section h2 {

    color: #FFCC00;
    cursor: pointer;

}


.menu-items {

    list-style-type: none;
    padding: 0;
    display: none;

}


.menu-items li {

    background-color: #222;
    color: white;
    padding: 10px;
    margin: 10px;
    border-radius: 5px;

}


.menu-toggle:hover {

    color: #FF9933;

}


</style>

</head>


<body>


<div class="content">


<div class="header-container">

<h1>
Welcome to the<br>
Roast Toast Coast Cafe!
</h1>

<p>
Where flavor meets the shore!
</p>

</div>



<section class="menu-section">


<h2 class="menu-toggle" onclick="toggleMenuItems()">
Our Menu
</h2>


<ul class="menu-items">

<li>Breezy Brews</li>
<li>Toasty Delights</li>
<li>Coastal Bites</li>
<li>Sunset Sips</li>

</ul>


</section>


</div>


<div class="image-container"></div>



<script>

function toggleMenuItems(){

const menuItems = document.querySelector('.menu-items');


menuItems.style.display =
menuItems.style.display === 'block'
? 'none'
: 'block';

}

</script>


</body>
</html>
